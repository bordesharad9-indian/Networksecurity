<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetSecScan — Upload</title>
<style>
  body {
    margin: 0;
    background: #0B0F14;
    color: #E6EDF3;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #121821;
    border: 1px solid #1E2A38;
    border-radius: 12px;
    padding: 32px;
    width: 360px;
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: #7E8CA0; font-size: 13px; margin: 0 0 24px; }
  input[type="file"] {
    width: 100%;
    padding: 10px;
    background: #161E29;
    border: 1px solid #1E2A38;
    border-radius: 8px;
    color: #E6EDF3;
    margin-bottom: 18px;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #5EEAD4;
    color: #06201C;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="card">
    <h1>NetSecScan</h1>
    <p>Upload a CSV to run a prediction scan</p>
    <form action="/predict" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept=".csv" required>
      <button type="submit">Run scan</button>
    </form>
  </div>
</body>
</html>
